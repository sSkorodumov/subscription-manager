services:
  postgres:
    image: postgres:16-alpine
    container_name: subscription_postgres
    environment:
      POSTGRES_DB: subscription_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscription_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: subscription_manager_app
    ports:
      - "8080:8080"
    environment:
      # Переопределяем адрес базы: внутри сети Docker хост localhost меняется на имя сервиса postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/subscription_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_FLYWAY_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy # Ждет, пока у Postgres успешно отработает healthcheck

volumes:
  pgdata:
